[project]
name = "src"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lancedb>=0.41.0",
    "langgraph>=1.2.19",
    "mcp>=2.3.0",
    "openai>=3.45.0",
    "playwright>=1.64.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
